<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12082b" />
    <meta name="description" content="Nibblio — eat, grow, outslither everyone. Free browser multiplayer worm arena." />
    <title>Nibblio — multiplayer worm arena</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <meta property="og:title" content="Nibblio — multiplayer worm arena" />
    <meta property="og:description" content="Eat. Grow. Outslither everyone. Free browser multiplayer worm arena." />
    <meta property="og:image" content="/social-preview.png" />
    <style>
      @font-face {
        font-family: "Baloo 2";
        src: url("/assets/fonts/baloo2-regular.ttf") format("truetype");
        font-weight: 400; font-display: swap;
      }
      @font-face {
        font-family: "Baloo 2";
        src: url("/assets/fonts/baloo2-semibold.ttf") format("truetype");
        font-weight: 600; font-display: swap;
      }
      @font-face {
        font-family: "Baloo 2";
        src: url("/assets/fonts/baloo2-extrabold.ttf") format("truetype");
        font-weight: 800; font-display: swap;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #12082b;
        overflow: hidden;
        font-family: "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
      }
      #app { width: 100%; height: 100%; position: relative; }
      #game { width: 100%; height: 100%; }

      /* Home overlay */
      #home {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 30%, #2a1458 0%, #12082b 70%);
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #home.hidden { display: none; }
      .logo-title {
        font-size: clamp(40px, 9vw, 84px);
        font-weight: 900;
        letter-spacing: 0.01em;
        background: linear-gradient(180deg, #ffd166 0%, #ff7b54 55%, #e84393 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 0 rgba(0,0,0,0.35));
      }
      .tagline { color: #b9a7e6; font-size: clamp(13px, 2.4vw, 17px); margin-top: -10px; }
      #nickname {
        width: min(320px, 78vw);
        padding: 14px 18px;
        font-size: 17px;
        border-radius: 14px;
        border: 2px solid #4a2f8f;
        background: #1d0f42; color: #fff;
        outline: none; text-align: center;
      }
      #nickname:focus { border-color: #8b5cf6; }
      #play {
        width: min(320px, 78vw);
        padding: 15px 18px;
        font-size: 20px; font-weight: 800; letter-spacing: 0.06em;
        border-radius: 14px; border: 0; cursor: pointer;
        color: #2b1a00;
        background: linear-gradient(180deg, #ffe08a 0%, #ffb545 100%);
        box-shadow: 0 4px 0 #b57718, 0 8px 22px rgba(0,0,0,0.35);
        transition: transform 0.06s ease;
      }
      #play:active { transform: translateY(3px); box-shadow: 0 1px 0 #b57718; }
      #play:disabled { opacity: 0.6; cursor: default; }
      #status { color: #8f7cc9; font-size: 14px; min-height: 20px; }
      #skins { display: flex; gap: 10px; }
      .skin-dot {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid transparent; cursor: pointer; padding: 0;
        box-shadow: 0 3px 8px rgba(0,0,0,0.35);
        transition: transform 0.1s ease;
      }
      .skin-dot:hover { transform: scale(1.12); }
      .skin-dot.selected { border-color: #ffd166; transform: scale(1.12); }
      .version { position: absolute; bottom: 10px; right: 14px; color: #55428a; font-size: 11px; }
      .footer-links {
        position: absolute; bottom: 10px; left: 0; right: 0;
        text-align: center; font-size: 12px;
      }
      .footer-links a { color: #8f7cc9; text-decoration: none; margin: 0 10px; }
      .footer-links a:hover { color: #b9a7e6; }
      .gear-btn {
        background: rgba(29, 15, 66, 0.8); color: #b9a7e6;
        border: 1px solid #3a2477; border-radius: 12px;
        width: 42px; height: 42px; font-size: 20px; cursor: pointer;
        pointer-events: auto;
      }
      #hud .gear-btn {
        position: absolute;
        left: max(14px, env(safe-area-inset-left));
        top: calc(max(12px, env(safe-area-inset-top)) + 64px);
      }
      #reconnect {
        position: absolute; inset: 0; z-index: 30;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; background: rgba(10, 4, 26, 0.8); color: #fff;
      }
      #reconnect.visible { display: flex; }
      #reconnect .spinner {
        width: 44px; height: 44px; border-radius: 50%;
        border: 4px solid #3a2477; border-top-color: #ffd166;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── in-game HUD ── */
      #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; display: none; }
      #hud.visible { display: block; }
      #score-panel {
        position: absolute;
        left: max(14px, env(safe-area-inset-left));
        top: max(12px, env(safe-area-inset-top));
        background: rgba(18, 8, 43, 0.72);
        border: 1px solid #3a2477; border-radius: 12px;
        padding: 8px 14px; color: #fff;
        font-size: 15px; font-weight: 700;
      }
      #score-panel .sub { font-size: 12px; font-weight: 500; color: #b9a7e6; }
      #effects {
        position: absolute;
        left: 50%; transform: translateX(-50%);
        top: max(12px, env(safe-area-inset-top));
        display: flex; gap: 6px;
      }
      #invite-btn {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        top: calc(max(12px, env(safe-area-inset-top)) + 118px);
        background: rgba(29, 15, 66, 0.85); color: #ffd166;
        border: 1px solid #3a2477; border-radius: 10px;
        padding: 6px 12px; font-size: 12px; font-weight: 700;
        font-family: inherit; cursor: pointer; pointer-events: auto;
      }
      #toast {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: 90px; z-index: 35;
        background: rgba(29, 15, 66, 0.95); color: #fff;
        border: 1px solid #8b5cf6; border-radius: 999px;
        padding: 9px 20px; font-size: 14px;
        opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
      }
      #toast.visible { opacity: 1; }
      #global-lb {
        /* side panel — pinned to the right edge, out of the play flow */
        position: absolute;
        right: max(22px, env(safe-area-inset-right));
        top: 50%; transform: translateY(-50%);
        width: min(280px, 26vw);
        background: rgba(29, 15, 66, 0.65);
        border: 1px solid #3a2477; border-radius: 14px;
        padding: 10px 16px; font-size: 13px; color: #cfc4ea;
        display: none;
      }
      #global-lb.visible { display: block; }
      #global-lb h3 {
        font-size: 11px; letter-spacing: 0.12em; color: #ffd166;
        margin-bottom: 6px; font-weight: 800; text-align: center;
      }
      #global-lb ol { list-style: none; }
      #global-lb li { display: flex; justify-content: space-between; gap: 10px; line-height: 1.6; }
      #global-lb li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #global-lb li span:last-child { color: #ffd166; font-weight: 700; }
      @media (max-width: 900px) {
        /* narrow screens: fall back into the column, below PLAY */
        #global-lb {
          position: static; transform: none;
          width: min(320px, 78vw);
        }
      }
      #minimap {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
        width: 148px; height: 148px;
        background: rgba(18, 8, 43, 0.72);
        border: 1px solid #3a2477; border-radius: 12px;
      }
      @media (pointer: coarse) {
        /* keep clear of the boost button on touch devices */
        #minimap { bottom: 132px; width: 118px; height: 118px; }
      }
      .effect-chip {
        background: rgba(124, 58, 237, 0.85);
        border: 1px solid #a78bfa; border-radius: 999px;
        padding: 4px 12px; color: #fff;
        font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em;
      }
      #leaderboard {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        top: max(12px, env(safe-area-inset-top));
        min-width: 168px;
        background: rgba(18, 8, 43, 0.72);
        border: 1px solid #3a2477; border-radius: 12px;
        padding: 8px 12px; color: #fff; font-size: 12.5px;
      }
      #leaderboard h3 {
        font-size: 11px; letter-spacing: 0.12em; color: #b9a7e6;
        margin-bottom: 5px; font-weight: 700;
      }
      #leaderboard ol { list-style: none; }
      #leaderboard li { display: flex; justify-content: space-between; gap: 10px; line-height: 1.55; }
      #leaderboard li.me { color: #ffd166; font-weight: 700; }
      #leaderboard .own-rank { margin-top: 4px; padding-top: 4px; border-top: 1px solid #3a2477; color: #ffd166; }

      /* ── death screen ── */
      #death {
        position: absolute; inset: 0; z-index: 9;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: rgba(10, 4, 26, 0.82);
        color: #fff; text-align: center;
      }
      #death.visible { display: flex; }
      #death h2 { font-size: clamp(28px, 6vw, 44px); color: #ff7b54; }
      #death .stats { color: #b9a7e6; font-size: 16px; line-height: 1.7; }
      #respawn {
        padding: 13px 34px; font-size: 18px; font-weight: 800;
        border-radius: 14px; border: 0; cursor: pointer; color: #2b1a00;
        background: linear-gradient(180deg, #ffe08a 0%, #ffb545 100%);
        box-shadow: 0 4px 0 #b57718;
      }
      #respawn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b57718; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="hud">
        <div id="score-panel">
          <div id="score-value">0</div>
          <div class="sub" id="score-sub">mass 10 · rank —</div>
        </div>
        <div id="effects"></div>
        <button class="gear-btn" id="settings-btn-game" aria-label="Settings">⚙</button>
        <canvas id="minimap" width="148" height="148" aria-label="Arena map"></canvas>
        <button id="invite-btn" aria-label="Copy invite link">🔗 Invite friends</button>
        <div id="leaderboard">
          <h3>LEADERBOARD</h3>
          <ol id="leaderboard-list"></ol>
          <div class="own-rank" id="own-rank"></div>
        </div>
      </div>
      <div id="toast" role="status"></div>
      <div id="reconnect">
        <div class="spinner"></div>
        <div id="reconnect-msg">Connection lost — reconnecting…</div>
      </div>
      <div id="death">
        <h2 id="death-title">YOU GOT NIBBLED</h2>
        <div class="stats" id="death-stats"></div>
        <button id="respawn">PLAY AGAIN</button>
      </div>
      <div id="home">
        <div class="logo-title" id="logo-title">NIBBLIO</div>
        <div class="tagline" id="tagline">Eat. Grow. Outslither everyone.</div>
        <input id="nickname" maxlength="16" placeholder="Your nickname" autocomplete="off" spellcheck="false" />
        <div id="skins" role="radiogroup" aria-label="Choose your worm skin"></div>
        <button id="play">PLAY</button>
        <div id="status" role="status"></div>
        <div id="global-lb"><h3>🏆 GLOBAL TOP 10</h3><ol id="global-lb-list"></ol></div>
        <button class="gear-btn" id="settings-btn-home" aria-label="Settings" style="position:absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));">⚙</button>
        <div class="footer-links">
          <a href="/legal/about.html">How to play</a>
          <a href="/legal/privacy.html">Privacy</a>
          <a href="/legal/terms.html">Terms</a>
        </div>
        <div class="version" id="version"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
